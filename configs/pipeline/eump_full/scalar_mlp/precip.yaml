# @package _global_

defaults:
  - /pipeline/eump_full/_shared/profile/city_scalar_mlp_processed
  - /pipeline/eump_full/_shared/target/crop_scalar_precip
  - _self_

experiment:
  name: mlp_precip

downstream:
  lr: 5e-4
  batch_size: 128
  scheduler:
    warmup_fraction: 0.2
    lr_start_factor: 0.1
    lr_end_factor: 0.1

model:
  mlp_hidden_dims:
    - 256
  dropout: 0.5
