# @package _global_

defaults:
  - /pipeline/eump_full/_shared/profile/swin_downstream
  - /pipeline/eump_full/_shared/target/scalar_pm25_mean
  - _self_

experiment:
  group: eump_full_mae_v3
  name: pm25

downstream:
  lr: 1e-4
  batch_size: 128
  encoder_checkpoint_file: eump_reconstruction_best_checkpoint.pt
  scheduler:
    warmup_fraction: 0.2
    lr_start_factor: 0.1
    lr_end_factor: 0.1

model:
  scalar_hidden_dim: 128
  dropout: 0.5

pipeline:
  center_ratio: 1.0
  year_range:
    - 2015
    - 2019
