defaults:
  - data: eump_full/server_v2
  - pipeline: eump_full/mae_v3/lst
  - eval: eump/downstream
  - _self_

hydra:
  job:
    chdir: false
  run:
    dir: ${hydra:runtime.cwd}/log/${experiment.group}/${experiment.name}/evaluation/${now:%Y-%m-%d}/${now:%H-%M-%S}

logging:
  level: INFO
  log_dir: null
  progress_bar: true

experiment:
  random_seed: 42
  center_ratio: 1.0
