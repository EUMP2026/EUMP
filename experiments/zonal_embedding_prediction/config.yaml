zonal_embedding_prediction:
  run_name: zonal_embedding_mae_v3
  csv_path: data/csv_data/zonal_merged_2020.csv
  output_root: experiments/zonal_embedding_prediction/outputs
  exclude_groups:
    - LST
    - Precip
    - GHG_mean
    - GHG_sum
    - Traffic
    - PM25
    - PM25_mean
  dynamic_years:
    - 2003
    - 2020
  static_embedding_year: 2018
  embedding:
    model_name: eump_full_mae_v3/pretrain
    checkpoint_file: eump_reconstruction_best_checkpoint.pt
    checkpoint_source: auto
    pipeline: eump_full/mae_v3/pretrain
    batch_size: 128
    workers_per_gpu: 4
    torch_threads: 1
    overwrite: false
  model:
    hidden_dim: 256
    dropout: 0.3
  training:
    lr: 1.0e-4
    weight_decay: 1.0e-2
    batch_size: 256
    epochs: 100
    regression_weight: 1.0
    lcz_weight: 1.0
    grad_clip_norm: 1.0
    log_every_n_epochs: 10
    scheduler:
      warmup_fraction: 0.2
      lr_start_factor: 0.08
      lr_end_factor: 0.2
